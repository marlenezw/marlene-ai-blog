{% extends "base.html" %}

{% block title %}message me - marlene.ai{% endblock %}

{% block content %}
<article class="message-page">
    <h1>✉ send me a message</h1>
    <p class="page-intro">Got a question, idea, or just want to say hi? Drop me a message below!</p>
    
    <form class="message-form" action="{{ url_for('send_message') }}" method="POST">
        <div class="form-group">
            <label for="name">your name</label>
            <input type="text" id="name" name="name" placeholder="what should I call you?" required>
        </div>
        <div class="form-group">
            <label for="email">your email <span class="optional">(optional, if you'd like a reply)</span></label>
            <input type="email" id="email" name="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label for="message">your message</label>
            <textarea id="message" name="message" rows="6" placeholder="what's on your mind?" required></textarea>
        </div>
        <button type="submit" class="btn-submit">send message 💜</button>
    </form>
    
    <div class="post-nav">
        <a href="{{ url_for('home') }}">← back to home</a>
    </div>
</article>
{% endblock %}
